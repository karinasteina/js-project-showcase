<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Game</title>
</head>
<body>
    <div id="mainScreen">
        <p>Type your guess:</p>
        <input type="text" id="input" name="fname" maxlength="1">
        <p id="output"></p>   
        <div id="incorrectScreen">
            <p id="incorrectOutput"></p>
        </div>
        <div id="guessesScreen">
            <p id="guessesOutput"></p>
        </div>
        <div id="incorrectScreen">
            <p id="remainingOutput"></p>
        </div>
        <button id="restartButton">RESTART</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
